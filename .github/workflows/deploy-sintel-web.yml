name: Deploy sintel-web to seed server

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'examples/sintel-web/**'
      - 'packages/publish/**'
      - 'packages/host-sdk/**'
      - 'packages/core/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build publish + sintel-web
        run: bun run build -- --filter=@z-torrent/publish --filter=sintel-web

      - name: Publish to seed server
        working-directory: examples/sintel-web
        env:
          ZT_SEED_SERVER_URL: ${{ secrets.ZT_SEED_SERVER_URL }}
          ZT_SEED_SERVER_API_KEY: ${{ secrets.ZT_SEED_SERVER_API_KEY }}
        run: bun ../../packages/publish/dist/cli.js --verbose
